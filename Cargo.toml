[package]
name = "ternary-types"
version = "0.2.0"
edition = "2021"
description = "Central dependency hub for the SuperInstance ternary fleet. Core types: Ternary, TritVector, TernaryMatrix, packed encoding, and Z₃ arithmetic."
repository = "https://github.com/SuperInstance/ternary-types"
homepage = "https://superinstance.ai"
license = "MIT OR Apache-2.0"
keywords = ["ternary", "trinary", "trit", "silo", "fleet"]
categories = ["data-structures", "encoding", "no-std", "mathematics", "science"]

[features]
default = ["std"]
std = []
serde = ["dep:serde"]
# Enable packed-bit-level operations (unsafe for bit twiddling)
packed = []

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
serde_json = "1"
serde_test = "1"
rand = "0.8"
